repos:
  - repo: https://github.com/tsvikas/sync-with-uv
    rev: v0.5.0
    hooks:
      - id: sync-with-uv
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.21.2
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty
        always_run: true
        entry: uv run --frozen --offline ty check
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: deptry
        name: deptry
        always_run: true
        entry: uv run --frozen --offline deptry src
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        always_run: true
        entry: uv run --frozen --offline lint-imports
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo-fmt
        always_run: true
        entry: uv run --frozen cargo fmt --check
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: clippy
        name: clippy
        always_run: true
        entry: uv run --frozen cargo clippy --all-targets --no-default-features -- -D warnings
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        always_run: true
        entry: uv run --frozen --offline basedpyright
        language: system
        types: [python]
        require_serial: true
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
